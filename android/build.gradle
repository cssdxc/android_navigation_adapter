group 'com.cssdxc.android_navigation_adapter'
version '0.0.1'

buildscript {
    ext.kotlin_version = '2.3.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.cssdxc.android_navigation_adapter'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
}
